{% extends 'base.html' %}

{% block auth %}
<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="brand-mark">CS</div>
      <div>
        <div class="brand-name">Clutch Sprint</div>
        <div class="brand-tag">Get your team sprint-ready fast</div>
      </div>
    </div>
    <h2 class="auth-title">Create your account</h2>
    <p class="auth-subtitle">Join the workspace and start planning.</p>
    {% if error %}
      <div class="alert alert-danger">{{ error }}</div>
    {% endif %}
    <form method="post" class="auth-form">
      <div class="mb-3">
        <label class="form-label">Name</label>
        <input class="form-control" name="name" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input class="form-control" type="email" name="email" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input class="form-control" name="username" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input class="form-control" type="password" name="password" required />
      </div>
      <button class="btn btn-success w-100" type="submit">Create Account</button>
    </form>
    <p class="mt-3 auth-alt">Have an account? <a href="{{ url_for('login') }}">Login</a></p>
  </div>
</div>
{% endblock %}
