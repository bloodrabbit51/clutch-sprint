<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset Password - Clutch Sprint</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="{{ url_for('static', filename='css/styles.css') }}" rel="stylesheet" />
</head>
<body class="app-body">
  <main class="container py-5 d-flex flex-column min-vh-100">
    <div class="flex-grow-1 d-flex align-items-center">
      <div class="card shadow-sm mx-auto" style="max-width: 460px; width: 100%;">
        <div class="card-body">
          <h4 class="mb-3">Reset Password</h4>
          {% if error %}
          <div class="alert alert-danger py-2">{{ error }}</div>
          {% endif %}
          {% if success %}
          <div class="alert alert-success py-2">{{ success }}</div>
          <a class="btn btn-primary w-100" href="{{ url_for('login') }}">Go to Login</a>
          {% else %}
          <form method="post">
            <div class="mb-3">
              <label class="form-label">New Password</label>
              <input type="password" class="form-control" name="password" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Confirm Password</label>
              <input type="password" class="form-control" name="confirm" required />
            </div>
            <button class="btn btn-primary w-100" type="submit">Update Password</button>
          </form>
          {% endif %}
        </div>
      </div>
    </div>
    <footer class="app-footer">Created by Shamim Ali</footer>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
