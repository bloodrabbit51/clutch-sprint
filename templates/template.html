{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2>CSV Templates</h2>
</div>

<div class="card">
  <div class="card-body">
    <div id="templateContent" class="template-markdown">Loading templates...</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
  (async () => {
    const container = document.getElementById("templateContent");
    try {
      const res = await fetch("{{ url_for('static', filename='templates.md') }}");
      const text = await res.text();
      container.innerHTML = marked.parse(text);
    } catch (err) {
      container.textContent = "Unable to load templates.";
    }
  })();
</script>
{% endblock %}
