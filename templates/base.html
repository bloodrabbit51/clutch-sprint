<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clutch Sprint</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="{{ url_for('static', filename='css/styles.css') }}" rel="stylesheet" />
</head>
<body class="app-body">
  {% if session.get('user_id') %}
  <div class="d-flex">
    <aside class="sidebar p-3">
      <h5 class="mb-4">Clutch Sprint</h5>
      <nav class="nav flex-column">
        <a class="nav-link" href="{{ url_for('sprint_plan') }}">Sprint Plan</a>
        <a class="nav-link" href="{{ url_for('project_plan') }}">Project Backlog</a>
        <a class="nav-link" href="{{ url_for('pi_plan') }}">PI Plan</a>
        <a class="nav-link" href="{{ url_for('previous_sprints') }}">Previous Sprints</a>
        <a class="nav-link" href="{{ url_for('projects') }}">Projects</a>
        <a class="nav-link" href="{{ url_for('template_page') }}">Template</a>
      </nav>
      <form class="mt-4" method="post" action="{{ url_for('logout') }}">
        <button class="btn btn-outline-light w-100" type="submit">Logout</button>
      </form>
    </aside>
    <main class="app-main flex-grow-1 p-4 d-flex flex-column">
      <div class="flex-grow-1">
        {% block content %}{% endblock %}
      </div>
      <footer class="app-footer">Created by Shamim Ali</footer>
    </main>
  </div>
  {% else %}
  <main class="container py-5 d-flex flex-column min-vh-100">
    <div class="flex-grow-1">
      {% block auth %}{% endblock %}
    </div>
    <footer class="app-footer">Created by Shamim Ali</footer>
  </main>
  {% endif %}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
