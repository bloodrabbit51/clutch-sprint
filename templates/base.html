<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SprintStream</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="{{ url_for('static', filename='css/styles.css') }}" rel="stylesheet" />
</head>
<body>
  {% if session.get('user_id') %}
  <div class="d-flex">
    <aside class="sidebar p-3">
      <h5 class="mb-4">SprintStream</h5>
      <nav class="nav flex-column">
        <a class="nav-link" href="{{ url_for('sprint_plan') }}">Sprint Plan</a>
        <a class="nav-link" href="{{ url_for('previous_sprints') }}">Previous Sprints</a>
        <a class="nav-link" href="{{ url_for('projects') }}">Projects</a>
      </nav>
      <form class="mt-4" method="post" action="{{ url_for('logout') }}">
        <button class="btn btn-outline-light w-100" type="submit">Logout</button>
      </form>
    </aside>
    <main class="flex-grow-1 p-4">
      {% block content %}{% endblock %}
    </main>
  </div>
  {% else %}
  <main class="container py-5">
    {% block auth %}{% endblock %}
  </main>
  {% endif %}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
